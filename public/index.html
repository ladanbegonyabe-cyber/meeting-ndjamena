<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meeting University of N'djamena</title>
<style>
body{background:#d6ecff;font-family:system-ui,sans-serif;margin:0;padding-bottom:70px;color:#10224a}
.w{max-width:560px;margin:auto;padding:12px}
.card{background:#fff;border-radius:20px;padding:14px;margin:12px 0}
input,textarea,select{width:100%;padding:12px;border:1px solid #b9d9f5;border-radius:14px;margin:5px 0;box-sizing:border-box;font-size:16px}
.btn{background:linear-gradient(135deg,#2f6bff,#8a4dff);border:0;border-radius:14px;padding:12px;color:#fff;font-weight:700;width:100%;cursor:pointer}
.ghost{background:none;border:1px solid #b9d9f5;border-radius:12px;padding:8px 12px;cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #ddd}
nav button{flex:1;border:0;background:none;padding:12px;font-size:20px;cursor:pointer}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#2f6bff,#8a4dff);display:grid;place-items:center;color:#fff;font-weight:800;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.row{display:flex;gap:10px;align-items:center}.sp{flex:1}.mut{color:#5b6f99;font-size:14px}
.post img,.post video{width:100%;border-radius:14px;margin:8px 0}
</style>
</head>
<body>
<div id="app"><div class="w"><h1>Meeting University of N'djamena</h1><p>Chargement...</p></div></div>
<script>
var tok = localStorage.getItem('t') || '';
var me = null;
var view = 'home';
function E(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(m){ alert(m); }
function show(html){ document.getElementById('app').innerHTML = '<div class="w">'+html+'</div>' + '<nav><button onclick="goHome()">🏡</button><button onclick="goNew()">✨</button><button onclick="goMe()">😎</button></nav>'; }
async function api(n, b){
  b = b || {};
  var r = await fetch('/api/'+n, {method:'POST', headers:{'Content-Type':'application/json','x-token':tok}, body: JSON.stringify(b)});
  return await r.json();
}
function authHTML(){
  return '<h1>Meeting University<br>of N\'djamena</h1><p class="mut">Le réseau des étudiants</p>'
    + '<div class="card"><input id="n" placeholder="Nom complet">'
    + '<input id="p" type="password" placeholder="Mot de passe">'
    + '<button class="btn" onclick="doLogin()">Se connecter</button>'
    + '<p class="mut" onclick="showReg()" style="cursor:pointer"><u>Créer un compte</u></p>'
    + '<p class="mut" onclick="doForgot()" style="cursor:pointer"><u>Mot de passe oublié</u></p></div>';
}
function showReg(){
  show('<h1>Créer un compte</h1><div class="card"><input id="n" placeholder="Nom complet"><input id="s" placeholder="Réponse secrète (ex: nom de ton animal)"><input id="p" type="password" placeholder="Mot de passe - ex: mon chat @ 2026 !"><button class="btn" onclick="doReg()">Créer mon compte</button><p class="mut" onclick="render()" style="cursor:pointer"><u>J\'ai déjà un compte</u></p></div>');
}
async function doLogin(){
  var n = document.getElementById('n').value;
  var p = document.getElementById('p').value;
  if(!n || !p) return alert('Mets ton nom et mot de passe');
  var r = await api('login', {name:n, pass:p});
  if(r.e) return alert(r.e);
  localStorage.setItem('t', r.t); tok = r.t; me = null; render();
}
async function doReg(){
  var n = document.getElementById('n').value;
  var p = document.getElementById('p').value;
  var s = document.getElementById('s').value;
  if(!n || !p || !s) return alert('Remplis nom + réponse secrète + mot de passe');
  var r = await api('reg', {name:n, pass:p, secret:s, filiere:'Général'});
  if(r.e) return alert(r.e);
  localStorage.setItem('t', r.t); tok = r.t; me = null; render();
}
async function doForgot(){
  var n = prompt('Ton nom');
  var s = prompt('Ta réponse secrète');
  var p = prompt('Nouveau mot de passe');
  if(!n || !s || !p) return;
  var r = await fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,secret:s,pass:p})}).then(function(x){return x.json()});
  alert(r.e || 'Mot de passe changé, connecte-toi');
}
function goHome(){ view='home'; render(); }
function goNew(){ view='new'; render(); }
function goMe(){ view='me'; render(); }
function goMsg(){ alert('Messages : reviens après déblocage, on remet tout après'); }
async function render(){
  try{
    if(!tok){ show(authHTML()); return; }
    if(!me){
      me = await api('me');
      if(!me || !me.id){ localStorage.removeItem('t'); tok=''; me=null; show(authHTML()); return; }
    }
    if(view==='new'){
      show('<h2>Publier</h2><div class="card"><textarea id="tx" rows="4" placeholder="Écris ici..."></textarea><button class="btn" onclick="doPub()">Publier</button></div><button class="ghost" onclick="goHome()">← Retour</button>');
      return;
    }
    if(view==='me'){
      var ps = await api('feed', {by: me.id});
      show('<div class="card" style="text-align:center"><div class="av" style="width:84px;height:84px;font-size:34px;margin:auto">'+E(me.name[0])+'</div><h2>'+E(me.name)+'</h2><p class="mut">'+E(me.filiere||'')+'</p><button class="ghost" onclick="doLogout()">Déconnexion</button></div><h2>Mes publications ('+ps.length+')</h2>' + ps.map(postHTML).join(''));
      return;
    }
    var posts = await api('feed', {});
    var h = '<h2>Accueil</h2><p class="mut">Connecté : '+E(me.name)+' · '+E(me.filiere||'')+'</p><button class="btn" onclick="goNew()">✨ Publier quelque chose</button>';
    if(!posts.length) h += '<p class="card">Aucune publication. Sois le premier !</p>';
    h += posts.map(postHTML).join('');
    show(h);
  }catch(e){
    show('<div class="card"><h2>Serveur en réveil 😴</h2><p>Attends 30 sec puis clique :</p><button class="btn" onclick="render()">🔄 Réessayer</button><p class="mut">Erreur : '+E(e.message)+'</p></div>');
  }
}
function postHTML(p){
  var likes = (p.likes||[]).length;
  var liked = (p.likes||[]).indexOf(me.id) >= 0;
  return '<div class="card"><div class="row"><div class="av">'+E((p.name||'?')[0])+'</div><b>'+E(p.name)+'</b><span class="sp"></span><span class="mut">'+E(p.group||'')+'</span></div><p style="white-space:pre-wrap">'+E(p.text)+'</p>'
    + (p.img ? '<img src="'+p.img+'">' : '')
    + '<div class="row"><button class="ghost" onclick="doLike(\''+p.id+'\')">'+(liked?'❤️ ':'🤍 ')+likes+'</button><button class="ghost" onclick="doComment(\''+p.id+'\')">💬 '+(p.com||[]).length+'</button></div>'
    + (p.com||[]).map(function(c){ return '<p style="font-size:14px"><b>'+E(c.name)+'</b> : '+E(c.text)+'</p>'; }).join('')
    + '</div>';
}
async function doPub(){
  var t = document.getElementById('tx').value;
  if(!t) return alert('Écris quelque chose');
  await api('post', {type:'post', text:t, group: me.filiere||'Général'});
  view='home'; render();
}
async function doLike(id){ await api('like', {id:id}); render(); }
async function doComment(id){
  var t = prompt('Ton commentaire');
  if(!t) return;
  await api('comment', {id:id, text:t}); render();
}
function doLogout(){ localStorage.removeItem('t'); tok=''; me=null; render(); }
render();
</script>
</body>
</html>
