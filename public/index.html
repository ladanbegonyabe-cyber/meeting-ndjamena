<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1030"><title>Meeting University of N'djamena</title>
<style>
:root{--bg:#0d1030;--card:#171b45;--line:#272c63;--t:#eef0ff;--mut:#9aa0d6;--g:linear-gradient(135deg,#2f6bff,#8a4dff)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t);font:16px/1.4 system-ui,sans-serif;padding-bottom:84px}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:5px 0}
.btn{background:var(--g);border:0;border-radius:14px;padding:12px 18px;font-weight:700;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);border-radius:12px;padding:6px 12px;cursor:pointer}
.w{max-width:560px;margin:auto;padding:12px}
.card{background:var(--card);border-radius:20px;padding:14px;margin:12px 0}
.mut{color:var(--mut);font-size:14px}.row{display:flex;gap:10px;align-items:center}.sp{flex:1}
h1,h2{font-weight:800}
.av{width:44px;height:44px;border-radius:50%;background:var(--g);display:grid;place-items:center;font-weight:800;flex:none}
nav{position:fixed;bottom:0;left:0;right:0;background:#10143a;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;font-size:30px;padding:12px 0;position:relative;opacity:.6}
nav button.on{opacity:1}
.dot{position:absolute;top:6px;right:22%;background:#ff4d6d;font-size:12px;border-radius:10px;padding:0 6px;color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0}.chips button{white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 14px;cursor:pointer}.chips .on{background:var(--g);border:0}
.st{display:flex;gap:12px;overflow-x:auto;padding:6px 0}.st div{text-align:center;font-size:12px;flex:none;width:68px}.st .av{width:62px;height:62px;border:3px solid #8a4dff;font-size:22px}
.ic{font-size:26px;background:none;border:0;cursor:pointer;padding:4px 8px}
.post img,.big{width:100%;border-radius:16px;margin:8px 0}
.b{max-width:78%;padding:9px 13px;border-radius:18px;margin:5px 0;background:var(--card)}.me{margin-left:auto;background:var(--g)}
.tag{background:var(--line);border-radius:10px;padding:2px 8px;font-size:12px}
.bar{background:var(--line);border-radius:10px;overflow:hidden;margin:5px 0;cursor:pointer;position:relative;padding:8px}.bar i{position:absolute;inset:0 auto 0 0;background:#3b4bd8;opacity:.6}.bar span{position:relative}
#ov{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:9;padding:20px;text-align:center}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--g);padding:10px 18px;border-radius:20px;display:none;z-index:10}
</style></head><body><div id="toast"></div><div id="ov" onclick="this.style.display='none'"></div><div id="app"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tok=localStorage.t||'',me,view='home',F={type:'',group:'',saved:0},cur=null,un=0,eco=localStorage.eco!=='0',ptimer,pun=-1,rec,chunks;
const api=async(n,b={})=>{const r=await fetch('/api/'+n,{method:'POST',headers:{'Content-Type':'application/json','x-token':tok},body:JSON.stringify(b)});if(r.status===401){localStorage.t=tok='';return render()}return r.json()};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)};
const ago=t=>{const m=(Date.now()-t)/6e4|0;return m<1?"à l'instant":m<60?m+' min':m<1440?(m/60|0)+' h':(m/1440|0)+' j'};
const av=n=>`<div class="av">${E(n[0]||'?').toUpperCase()}</div>`;
const vb=v=>v?' ✅':'';
function img(file){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{if(!eco)return ok(r.result);const i=new Image();i.onload=()=>{const k=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.6))};i.src=r.result};r.readAsDataURL(file)})}
const pick=()=>new Promise(ok=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>i.files[0]&&img(i.files[0]).then(ok);i.click()});
function nav(){return`<nav>${[['home','🏠'],['search','🔍'],['new','➕'],['msg','💬'],['me','👤']].map(([v,i])=>`<button class="${view===v?'on':''}" onclick="go('${v}')">${i}${v==='msg'&&un?`<span class="dot">${un}</span>`:''}</button>`).join('')}</nav>`}
function go(v,c){view=v;cur=c||null;render()}
async function render(){
if(!tok){$('#app').innerHTML=authHTML();return}
if(!me){me=await api('me');if(!me||!me.id)return}
let h='';
if(view==='home')h=await home();else if(view==='search')h=searchV();else if(view==='new')h=newV();else if(view==='msg')h=cur?await convo():await chats();else h=await prof(cur||me.id);
$('#app').innerHTML=`<div class="w">${h}</div>`+nav();
if(view==='msg'&&cur){const m=$('#ml');m&&(m.scrollTop=1e9,scrollTo(0,1e9))}
clearInterval(ptimer);ptimer=setInterval(tick,3000);
}
function authHTML(){const reg=window.reg;return`<div class="w"><h1 style="margin-top:40px;font-size:30px">Meeting University of N'djamena</h1><p class="mut">Le réseau des étudiants</p><div class="card">
<input id="n" placeholder="Nom complet">${reg?'<input id="f" placeholder="Filière (ex : Droit L2)"><input id="s" placeholder="Réponse secrète (ex : ville de naissance)">':''}
<input id="p" type="password" placeholder="Mot de passe">
<button class="btn" style="width:100%;margin-top:8px" onclick="auth()">${reg?'Créer mon compte':'Se connecter'}</button>
<p class="mut" style="margin-top:12px" onclick="reg=!reg;render()"><u>${reg?'J\'ai déjà un compte':'Créer un compte'}</u></p>
${reg?'':'<p class="mut" style="margin-top:8px" onclick="forgot()"><u>Mot de passe oublié</u></p>'}</div></div>`}
async function auth(){const r=await api(window.reg?'reg':'login',{name:$('#n').value,pass:$('#p').value,filiere:$('#f')?.value,secret:$('#s')?.value});if(r.e)return toast(r.e);localStorage.t=tok=r.t;me=null;view='home';Notification&&Notification.requestPermission&&Notification.requestPermission();render()}
async function forgot(){const n=$('#n').value||prompt('Ton nom'),s=prompt('Ta réponse secrète'),p=prompt('Nouveau mot de passe');if(!n||!s||!p)return;const r=await fetch('/api/reset',{method:'POST',body:JSON.stringify({name:n,secret:s,pass:p})}).then(r=>r.json());toast(r.e||'Mot de passe changé')}
async function home(){const[st,ps]=await Promise.all([api('stories'),api('feed',{type:F.type,group:F.group,saved:F.saved})]);
const T=[['','Tout'],['annonce','📢 Annonces'],['cours','📚 Cours'],['event','🎉 Événements'],['poll','📊 Sondages'],['vente','🛒 Petites annonces']];
return`<h2>Accueil</h2><div class="st"><div onclick="story()"><div class="av" style="border-style:dashed">＋</div>Mon statut</div>${st.map(s=>`<div onclick='viewSt(${JSON.stringify(s).replace(/'/g,"&#39;")})'>${av(s.name)}${E(s.name.split(' ')[0])}</div>`).join('')}</div>
<div class="chips">${T.map(([v,l])=>`<button class="${F.type===v&&!F.saved?'on':''}" onclick="F.type='${v}';F.saved=0;render()">${l}</button>`).join('')}<button class="${F.saved?'on':''}" onclick="F.saved=1;render()">🔖 Favoris</button></div>
<div class="chips"><button class="${F.group?'':'on'}" onclick="F.group='';render()">Toutes les filières</button><button class="${F.group?'on':''}" onclick="F.group='${E(me.filiere)}';render()">Ma filière : ${E(me.filiere)}</button></div>
${ps.map(postH).join('')||'<p class="mut card">Aucune publication ici. Utilise ➕ pour publier.</p>'}`}
function postH(p){const sv=me.saved.includes(p.id),tot=p.opts.reduce((a,o)=>a+o.v.length,0),L={annonce:'📢 Annonce',cours:'📚 Cours',event:'🎉 Événement',poll:'📊 Sondage',vente:'🛒 Petite annonce'}[p.type];
return`<div class="card post"><div class="row" onclick="go('me','${p.by}')">${av(p.name)}<div><b>${E(p.name)}</b><div class="mut">${ago(p.at)}${p.group?' · '+E(p.group):''}</div></div></div>
${L?`<p style="margin-top:8px"><span class="tag">${L}</span>${p.date?` <span class="tag">📅 ${E(p.date)}</span>`:''}</p>`:''}
<p style="margin-top:8px;white-space:pre-wrap">${E(p.text)}</p>${p.img?`<img src="${p.img}">`:''}
${p.opts.map((o,i)=>`<div class="bar" onclick="api('vote',{id:'${p.id}',i:${i}}).then(render)"><i style="width:${tot?o.v.length/tot*100:0}%"></i><span>${E(o.t)} · ${o.v.length}</span></div>`).join('')}
<div class="row"><button class="ic" onclick="api('like',{id:'${p.id}'}).then(render)">${p.likes.includes(me.id)?'❤️':'🤍'}</button>${p.likes.length}<button class="ic" onclick="cm('${p.id}')">💬</button>${p.com.length}<span class="sp"></span><button class="ic" onclick="api('save',{id:'${p.id}'}).then(()=>{me=null;render()})">${sv?'🔖':'📑'}</button><button class="ic" onclick="rep('${p.by}')">🚩</button></div>
${p.com.map(c=>`<p class="mut"><b>${E(c.name)}</b> ${E(c.text)}</p>`).join('')}</div>`}
async function cm(i){const t=prompt('Ton commentaire');t&&(await api('comment',{id:i,text:t}),render())}
async function rep(i){const t=prompt('Pourquoi signaler ? (spam, harcèlement…)');t&&(await api('report',{target:i,why:t}),toast('Signalement envoyé'))}
async function story(){const t=prompt('Texte du statut (vide = photo seule)')||'';const i=confirm('Ajouter une photo ?')?await pick():'';(t||i)&&(await api('story',{text:t,img:i}),toast('Statut publié (24 h)'),render())}
function viewSt(s){const o=$('#ov');o.innerHTML=`<div><b>${E(s.name)}</b> <span class="mut">${ago(s.at)}</span>${s.img?`<img class="big" src="${s.img}">`:''}<h2 style="margin-top:14px">${E(s.text)}</h2></div>`;o.style.display='grid'}
function searchV(){return`<h2>Recherche</h2><input id="q" placeholder="Étudiant, filière ou mot…" oninput="srch(this.value)"><div id="r"></div>`}
let sT;function srch(q){clearTimeout(sT);sT=setTimeout(async()=>{if(!q)return $('#r').innerHTML='';const[u,p]=await Promise.all([api('users',{q}),api('feed',{q})]);$('#r').innerHTML=u.map(x=>`<div class="card row" onclick="go('me','${x.id}')">${av(x.name)}<div><b>${E(x.name)}${vb(x.v)}</b><div class="mut">${E(x.filiere)}</div></div></div>`).join('')+p.map(postH).join('')||'<p class="mut">Aucun résultat</p>'},300)}
let draft={};
function newV(){return`<h2>Publier</h2><div class="card"><select id="ty"><option value="post">Publication</option><option value="annonce">📢 Annonce</option><option value="cours">📚 Cours / document</option><option value="event">🎉 Événement</option><option value="poll">📊 Sondage</option><option value="vente">🛒 Petite annonce</option></select>
<textarea id="tx" rows="4" placeholder="Écris ici…"></textarea><input id="dt" placeholder="Date de l'événement (ex : 20 nov. à 15h)"><textarea id="op" rows="3" placeholder="Sondage : une option par ligne"></textarea>
<label class="row"><input type="checkbox" id="gp" style="width:auto"> Réserver à ma filière (${E(me.filiere)})</label>
<div id="pv"></div><div class="row"><button class="ghost" onclick="pickP()">📷 Photo</button><span class="sp"></span><button class="btn" onclick="pub()">Publier</button></div></div>`}
async function pickP(){draft.img=await pick();$('#pv').innerHTML=`<img class="big" src="${draft.img}">`}
async function pub(){const r=await api('post',{type:$('#ty').value,text:$('#tx').value,date:$('#dt').value,img:draft.img,group:$('#gp').checked?me.filiere:'',opts:$('#op').value.split('\n').filter(x=>x.trim())});if(r.e)return toast(r.e);draft={};toast('Publié');go('home')}
async function chats(){const c=await api('chats'),u=await api('users',{q:''});
return`<h2>Messages</h2>${c.map(x=>`<div class="card row" onclick="go('msg','${x.id}')">${av(x.name)}<div class="sp"><b>${E(x.name)}</b><div class="mut">${E(x.last).slice(0,40)}</div></div>${x.un?`<span class="dot" style="position:static">${x.un}</span>`:''}</div>`).join('')}
<p class="mut" style="margin-top:16px">Écrire à un étudiant</p><div class="chips">${u.slice(0,15).map(x=>`<button onclick="go('msg','${x.id}')">${E(x.name)}</button>`).join('')}</div>`}
async function convo(){const r=await api('convo',{with:cur}),u=await api('user',{id:cur});
return`<div class="row"><button class="ic" onclick="go('msg')">⬅️</button>${av(u.name||'?')}<div><b>${E(u.name)}${vb(u.v)}</b><div class="mut" id="ty">${r.ty?"en train d'écrire…":''}</div></div></div><div id="ml" style="padding:10px 0;min-height:60vh">${r.m.map(m=>`<div class="b ${m.from===me.id?'me':''}">${m.audio?`<audio controls src="${m.audio}" style="max-width:100%"></audio>`:E(m.text)}${m.from===me.id?`<div class="mut" style="text-align:right;font-size:11px">${m.seen?'vu ✓✓':'envoyé ✓'}</div>`:''}</div>`).join('')}</div>
<div class="row" style="position:sticky;bottom:80px;background:var(--bg);padding:6px 0"><input id="mt" placeholder="Message…" oninput="api('typing',{to:cur})" onkeydown="event.key==='Enter'&&snd()"><button class="ic" id="mic" onclick="mic()">🎤</button><button class="ic" onclick="snd()">➤</button></div>`}
async function snd(a){const t=$('#mt')?.value;if(!t&&!a)return;await api('send',{to:cur,text:a?'':t,audio:a||''});render()}
async function mic(){if(rec&&rec.state==='recording'){rec.stop();return}try{const s=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(s);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{s.getTracks().forEach(t=>t.stop());$('#mic').textContent='🎤';const f=new FileReader();f.onload=()=>snd(f.result);f.readAsDataURL(new Blob(chunks,{type:rec.mimeType}))};rec.start();$('#mic').textContent='⏹️';toast('Enregistrement… touche ⏹️ pour envoyer')}catch(e){toast('Micro refusé')}}
async function prof(i){const u=i===me.id?{...me,posts:0}:await api('user',{id:i}),ps=await api('feed',{by:i}),mine=i===me.id,fl=me.following.includes(i);
return`<div class="card" style="text-align:center"><div class="av" style="width:84px;height:84px;font-size:34px;margin:auto">${E(u.name[0]).toUpperCase()}</div><h2 style="margin-top:8px">${E(u.name)}${vb(u.v)}</h2><p class="mut">${E(u.filiere)} · ${u.fol} abonné(s)</p><p>${E(u.bio)}</p>
<div class="row" style="justify-content:center;margin-top:10px;flex-wrap:wrap">${mine?`<button class="ghost" onclick="edit()">✏️ Modifier</button><button class="ghost" onclick="chpw()">🔑 Mot de passe</button><button class="ghost" onclick="eco=!eco;localStorage.eco=eco?1:0;toast(eco?'Économie de données activée':'Photos en qualité maximale')">📶 Économie de données</button><button class="ghost" onclick="localStorage.t=tok='';me=null;render()">Déconnexion</button>`:`<button class="btn" onclick="api('follow',{id:'${i}'}).then(()=>{me=null;render()})">${fl?'Abonné ✓':'S\'abonner'}</button><button class="ghost" onclick="go('msg','${i}')">💬 Message</button><button class="ghost" onclick="if(confirm('Bloquer ?'))api('block',{id:'${i}'}).then(()=>{me=null;go('home')})">🚫</button>`}</div></div>${ps.map(postH).join('')}`}
async function edit(){const b=prompt('Ta bio',me.bio),f=prompt('Ta filière',me.filiere);if(b===null)return;await api('bio',{bio:b,filiere:f});me=null;render()}
async function chpw(){const o=prompt('Ancien mot de passe'),n=prompt('Nouveau mot de passe');if(!o||!n)return;const r=await api('pass',{old:o,pass:n});toast(r.e||'Mot de passe changé')}
async function tick(){if(!tok||document.hidden&&0)return;const p=await api('poll');if(!p||p.un===undefined)return;un=p.un;if(pun>=0&&p.un>pun&&p.last){toast('💬 '+p.last.name+' : '+p.last.text.slice(0,40));try{new Notification(p.last.name,{body:p.last.text})}catch(e){}}pun=p.un;
if(view==='msg'&&cur&&document.activeElement?.id!=='mt')render();else if(view==='msg'&&!cur)render();else if(view==='home'&&!document.querySelector('#ov[style*=grid]'))render();else{const n=document.querySelector('nav .dot');n&&(n.textContent=un)}}
render();
</script></body></html>
