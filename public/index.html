<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meeting University of N'djamena</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>document.documentElement.dataset.theme=localStorage.getItem('th')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js')}</script>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#161a2b;--mu:#6b7490;--pr:#4f46e5;--bd:#e3e6f2;--ok:#0e9f6e;--red:#e11d48;--g:linear-gradient(135deg,#2563eb,#7c3aed);--sh:0 4px 18px rgba(79,70,229,.10)}
:root[data-theme=dark]{--bg:#0b0f1a;--card:#141a2a;--tx:#eaedf7;--mu:#98a1bd;--pr:#818cf8;--bd:#232b42;--ok:#2dd4a0;--sh:0 4px 18px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:84px}
.wrap{max-width:640px;margin:0 auto;padding:12px}
header{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:.95em;box-shadow:0 2px 14px rgba(79,70,229,.35)}
header span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#th{padding:8px 12px;font-size:1.3em;background:rgba(255,255,255,.2);border-radius:99px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(0,0,0,.08)}
nav button{flex:1;background:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px;font-size:.8em;font-weight:500;position:relative}
nav button .ic{font-size:2.2em;line-height:1;filter:grayscale(1);opacity:.7;transition:.2s}
nav button.on{color:var(--pr)}
nav button.on .ic{filter:none;opacity:1;transform:translateY(-2px) scale(1.12)}
nav .bd{position:absolute;top:0;left:55%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
input,textarea,select{width:100%;padding:11px 13px;margin:4px 0;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--pr)}
button{padding:10px 16px;border:0;border-radius:12px;background:var(--g);color:#fff;font:inherit;font-weight:600;cursor:pointer;transition:transform .15s}
button:active{transform:scale(.95)}button:disabled{opacity:.6}
button.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:500}
.row{display:flex;gap:10px;align-items:center}.mu{color:var(--mu);font-size:.85em}
.av{width:50px;height:50px;border-radius:50%;object-fit:cover;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.av.big{width:92px;height:92px;font-size:2em;border:4px solid var(--card)}
.chip{background:var(--bg);color:var(--pr);border-radius:99px;padding:1px 8px;font-size:.72em;font-weight:600;margin-left:6px}
.mw{position:relative;margin:10px -14px 0}
.media{display:block;width:100%;max-height:520px;object-fit:cover;background:#000}
#pv .media{border-radius:12px;margin-top:8px}
.heart{position:absolute;left:50%;top:50%;font-size:5em;animation:hb .8s ease forwards;pointer-events:none}
@keyframes hb{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.pop{animation:pop .35s}@keyframes pop{50%{transform:scale(1.35)}}
.err{color:var(--red)}.okm{color:var(--ok)}
.chat{height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:6px}
.b{max-width:80%;padding:8px 12px;border-radius:18px 18px 18px 4px;background:var(--bg);border:1px solid var(--bd)}
.b.me{align-self:flex-end;background:var(--g);color:#fff;border:0;border-radius:18px 18px 4px 18px}
.u{cursor:pointer}
.bd{background:var(--red);color:#fff;border-radius:99px;padding:1px 7px;font-size:.75em;margin-left:4px;display:none}
.cm .t{margin-top:6px}
#v>*{animation:up .35s ease both}@keyframes up{from{opacity:0;transform:translateY(14px)}}
.cover{height:110px;margin:-14px -14px 0;border-radius:20px 20px 0 0}
.prof{margin-top:-46px;justify-content:center}
.stories{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px}
.st{flex:none;text-align:center;width:84px;font-size:.78em;cursor:pointer}
.ring{padding:3px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#ec4899,#7c3aed);display:inline-block}
.ring.add{background:var(--bd)}
.ring .av{width:72px;height:72px;border:3px solid var(--bg)}
#sv{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;justify-content:center;color:#fff}
#sv img,#sv video{width:100%;max-height:78vh;object-fit:contain}
#splash{position:fixed;inset:0;z-index:99;background:var(--g);display:flex;align-items:center;justify-content:center;transition:opacity .4s}
#splash svg{animation:pulse 1.2s infinite}@keyframes pulse{50%{transform:scale(1.15)}}
#splash.out{opacity:0}
#sq{border-radius:99px;padding:13px 18px;margin:0 0 10px;font-size:1em}
.act button{font-size:1.2em;padding:10px 20px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="splash"><svg width="84" height="84" viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="#fff"/><text x="24" y="33" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-style="italic" font-size="24" fill="#4f46e5">MU</text></svg></div>
<header>
  <svg width="40" height="40" viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="#fff"/><text x="24" y="33" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-style="italic" font-size="24" fill="#4f46e5">MU</text></svg>
  <span>Meeting University of N'djamena</span>
  <button id="th" aria-label="Changer de thème"></button>
</header>
<div class="wrap" id="app"></div>
<script>
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tok=localStorage.getItem('t'),me=null,tab='feed',peer=null,timer=null,poll=null,reg=false,lastN=0,S={},lt=0;
const $=s=>document.querySelector(s),app=$('#app');

function setTh(t){document.documentElement.dataset.theme=t;localStorage.setItem('th',t);$('#th').textContent=t=='dark'?'☀️':'🌙';$('meta[name=theme-color]').content=t=='dark'?'#0b0f1a':'#4f46e5'}
setTh(document.documentElement.dataset.theme);
$('#th').onclick=()=>setTh(document.documentElement.dataset.theme=='dark'?'light':'dark');

async function api(p,o={}){
  o.headers={...(o.headers||{}),Authorization:'Bearer '+tok};
  if(o.body&&!(o.body instanceof FormData)){o.headers['Content-Type']='application/json';o.body=JSON.stringify(o.body)}
  const r=await fetch('/api'+p,o),d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||'Erreur');return d}
const av=(u,big)=>u.avatar?`<img class="av ${big?'big':''}" src="${E(u.avatar)}">`:`<div class="av ${big?'big':''}">${E((u.name||'?')[0])}</div>`;
const fmt=t=>new Date(t).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'});
const hue=s=>[...String(s||'')].reduce((a,c)=>a+c.charCodeAt(0),0)%360;
const cover=u=>`<div class="cover" style="background:linear-gradient(135deg,hsl(${hue(u.name)},75%,50%),hsl(${(hue(u.name)+60)%360},75%,45%))"></div>`;

function setBadge(n){const b=$('#bd');if(b){b.textContent=n;b.style.display=n?'inline-block':'none'}
  document.title=(n?`(${n}) `:'')+"Meeting University of N'djamena"}
function notify(m){try{if(Notification.permission!=='granted')return;
  navigator.serviceWorker.ready.then(r=>r.showNotification(m.name,{body:m.text,icon:'/icon-192.png',tag:'msg'}))}catch{}}
function startPoll(){clearInterval(poll);
  const t=async()=>{try{const d=await api('/unread');setBadge(d.n);
    if(d.n>lastN&&d.last&&!(tab=='ib'&&peer))notify(d.last);lastN=d.n}catch{}};
  t();poll=setInterval(t,5000)}

function authView(){
  clearInterval(timer);clearInterval(poll);setBadge(0);
  app.innerHTML=`<div class="card"><h3>${reg?'Créer mon compte':'Connexion'}</h3>
  <form id="f">
  ${reg?`<input name="name" placeholder="Nom complet" required>`:''}
  <input name="email" type="email" placeholder="Email" required>
  <input name="password" type="password" placeholder="Mot de passe (6 caractères min.)" required>
  ${reg?`<input name="faculty" placeholder="Faculté / Filière">
  <select name="level"><option value="">Niveau</option><option>Licence 1</option><option>Licence 2</option><option>Licence 3</option><option>Master 1</option><option>Master 2</option><option>Doctorat</option></select>
  <input name="phone" placeholder="Téléphone (privé)">
  <textarea name="bio" rows="2" placeholder="À propos de moi"></textarea>
  <label class="mu">Photo de profil</label><input name="avatar" type="file" accept="image/*">`:''}
  <p class="err" id="e"></p><button>${reg?'S\'inscrire':'Se connecter'}</button></form>
  <p class="mu u" id="sw">${reg?'Déjà un compte ? Se connecter':'Pas de compte ? S\'inscrire'}</p></div>`;
  $('#sw').onclick=()=>{reg=!reg;authView()};
  $('#f').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;
    try{const fd=new FormData(e.target);
      const d=await api(reg?'/register':'/login',{method:'POST',body:reg?fd:Object.fromEntries(fd)});
      tok=d.token;me=d.me;localStorage.setItem('t',tok);main()}catch(x){$('#e').textContent=x.message;btn.disabled=false}}}

function main(){
  const IC={feed:'🏠',ib:'💬',me:'👤'};
  app.innerHTML=`<nav>${[['feed','Fil'],['ib','Messages'],['me','Profil']].map(([k,l])=>
    `<button class="${tab==k?'on':''}" data-t="${k}"><span class="ic">${IC[k]}</span>${l}${k=='ib'?'<span class="bd" id="bd"></span>':''}</button>`).join('')}</nav><div id="v"></div>`;
  app.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
    if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
    tab=b.dataset.t;peer=null;main()});
  clearInterval(timer);startPoll();
  ({feed:feedView,ib:ibView,me:profView})[tab]()}

async function like(x){
  const d=await api('/posts/'+x.dataset.l+'/like',{method:'POST'});
  x.innerHTML=(d.liked?'❤️':'🤍')+' '+d.n;x.classList.remove('pop');void x.offsetWidth;x.classList.add('pop')}
function heart(m){const h=document.createElement('div');h.className='heart';h.textContent='❤️';m.appendChild(h);setTimeout(()=>h.remove(),800)}

app.onclick=async e=>{
  const g=a=>e.target.closest('['+a+']');let x;
  try{
    if(e.target.matches('.mw img')){const n=Date.now();
      if(n-lt<350){lt=0;const b=e.target.closest('.card').querySelector('[data-l]');
        heart(e.target.parentNode);if(b.textContent.includes('🤍'))await like(b)}else lt=n;return}
    if(x=g('data-d')){await api('/posts/'+x.dataset.d,{method:'DELETE'});$('#p'+x.dataset.d).remove()}
    else if(x=g('data-l')){await like(x)}
    else if(x=g('data-c')){openCm(x.dataset.c)}
    else if(x=g('data-cs')){const id=x.dataset.cs,v=$('#ci'+id).value.trim();if(!v)return;
      await api('/posts/'+id+'/comments',{method:'POST',body:{text:v}});$('#cm'+id).innerHTML='';openCm(id)}
    else if(x=g('data-p')){userView(x.dataset.p)}
    else if(x=g('data-s')){story(x.dataset.s)}
    else if(g('data-add')){$('#sf').click()}
  }catch(err){alert(err.message)}};

async function openCm(id){
  const c=$('#cm'+id);if(c.innerHTML){c.innerHTML='';return}
  const cs=await api('/posts/'+id+'/comments'),b=document.querySelector('[data-c="'+id+'"]');
  if(b)b.textContent='💬 '+cs.length;
  c.innerHTML=cs.map(m=>`<div class="t"><b class="u" data-p="${m.uid}">${E(m.name)}</b> ${E(m.text)} <span class="mu">${fmt(m.ts)}</span></div>`).join('')+
    `<div class="row"><input id="ci${id}" placeholder="Votre commentaire…"><button data-cs="${id}">Envoyer</button></div>`}

const postHtml=p=>`<div class="card" id="p${p.id}"><div class="row"><div class="row u" data-p="${p.uid}">${av(p)}<div><b>${E(p.name)}</b>${p.faculty?`<span class="chip">${E(p.faculty)}</span>`:''}<div class="mu">${fmt(p.ts)}</div></div></div>
  ${p.uid==me.id?`<button class="alt" style="margin-left:auto" data-d="${p.id}">Suppr.</button>`:''}</div>
  <p>${E(p.text)}</p>${p.type=='image'?`<div class="mw"><img class="media" src="${E(p.media)}"></div>`:p.type=='video'?`<div class="mw"><video class="media" controls src="${E(p.media)}"></video></div>`:''}
  <div class="row act" style="margin-top:10px"><button class="alt" data-l="${p.id}">${p.liked?'❤️':'🤍'} ${p.likes}</button><button class="alt" data-c="${p.id}">💬 ${p.ncom}</button></div>
  <div class="cm" id="cm${p.id}"></div></div>`;

function buildStories(ps){
  const lim=Date.now()-864e5;S={};
  ps.filter(p=>p.media&&new Date(p.ts)>lim).reverse().forEach(p=>(S[p.uid]=S[p.uid]||{u:p,l:[]}).l.push(p));
  $('#s').innerHTML=`<div class="st" data-add="1"><span class="ring add"><div class="av" style="background:var(--bg);color:var(--pr);font-size:2em">＋</div></span><div>Ma story</div></div>`+
    Object.entries(S).map(([id,s])=>`<div class="st" data-s="${id}"><span class="ring">${av(s.u)}</span><div>${E(s.u.name.split(' ')[0])}</div></div>`).join('')}

function story(id){
  const s=S[id];let i=0,tm;if(!s)return;
  const o=document.createElement('div');o.id='sv';document.body.appendChild(o);
  const close=()=>{clearTimeout(tm);o.remove()};
  const show=()=>{clearTimeout(tm);if(i<0)i=0;if(i>=s.l.length)return close();const p=s.l[i];
    o.innerHTML=`<div class="row" style="padding:12px;position:absolute;top:0;left:0;right:0;z-index:2;background:linear-gradient(#000a,transparent)">${av(p)}<b style="flex:1">${E(p.name)}</b><span>${i+1}/${s.l.length}</span><button id="x" style="background:none;font-size:1.4em">✕</button></div>`+
      (p.type=='video'?`<video autoplay playsinline src="${E(p.media)}"></video>`:`<img src="${E(p.media)}">`)+`<p style="padding:12px;text-align:center">${E(p.text)}</p>`;
    o.querySelector('#x').onclick=e=>{e.stopPropagation();close()};
    const v=o.querySelector('video');if(v)v.onended=()=>{i++;show()};else tm=setTimeout(()=>{i++;show()},5000)};
  o.onclick=e=>{i+=e.clientX<innerWidth/3?-1:1;show()};show()}

async function feedView(){
  $('#v').innerHTML=`<input id="sq" type="search" placeholder="🔍 Rechercher une publication, un étudiant…"><input id="sf" type="file" accept="image/*,video/*" hidden><div class="stories" id="s"></div><div class="card"><textarea id="t" rows="2" placeholder="Quoi de neuf sur le campus ?"></textarea>
  <input id="m" type="file" accept="image/*,video/*"><div id="pv"></div><p class="err" id="e"></p><button id="go">Publier</button></div>
  <div id="l"></div><button class="alt" id="more" style="width:100%;display:none">Voir plus</button>`;
  const flt=()=>{const q=$('#sq').value.trim().toLowerCase();document.querySelectorAll('#l .card').forEach(c=>c.style.display=c.textContent.toLowerCase().includes(q)?'':'none')};
  $('#sq').oninput=flt;
  $('#sf').onchange=async e=>{const f=e.target.files[0];if(!f)return;const l=document.querySelector('[data-add] div:last-child');if(l)l.textContent='Envoi…';
    const fd=new FormData();fd.append('text','✨');fd.append('media',f);
    try{await api('/posts',{method:'POST',body:fd});feedView()}catch(x){alert(x.message);feedView()}};
  $('#m').onchange=e=>{const f=e.target.files[0];
    $('#pv').innerHTML=!f?'':f.type.startsWith('video')?`<video class="media" controls src="${URL.createObjectURL(f)}"></video>`:`<img class="media" src="${URL.createObjectURL(f)}">`};
  $('#go').onclick=async()=>{const fd=new FormData();fd.append('text',$('#t').value);if($('#m').files[0])fd.append('media',$('#m').files[0]);
    try{$('#go').disabled=true;$('#go').textContent='Publication…';await api('/posts',{method:'POST',body:fd});feedView()}
    catch(x){$('#e').textContent=x.message;$('#go').disabled=false;$('#go').textContent='Publier'}};
  let before=0,first=true;
  const load=async()=>{const ps=await api('/posts'+(before?'?before='+before:''));
    if(first){buildStories(ps);if(!ps.length)$('#l').innerHTML='<p class="mu">Aucune publication. Écris la première !</p>'}
    first=false;$('#l').insertAdjacentHTML('beforeend',ps.map(postHtml).join(''));flt();
    if(ps.length)before=ps[ps.length-1].ts;$('#more').style.display=ps.length==20?'block':'none'};
  $('#more').onclick=load;load()}

async function ibView(){
  if(peer)return chatView();
  $('#v').innerHTML=`<input id="q" placeholder="Rechercher un étudiant (nom, filière)…"><div id="l"></div>`;
  let tm;
  const draw=async()=>{const us=await api('/users?q='+encodeURIComponent($('#q').value));
    $('#l').innerHTML=us.map(u=>`<div class="card row u" data-u="${u.id}">${av(u)}<div style="flex:1"><b>${E(u.name)}</b><div class="mu">${E(u.faculty)} ${E(u.level)}</div></div>
      ${u.unread?`<span class="bd" style="display:inline-block">${u.unread}</span>`:''}<button class="alt" data-p="${u.id}">Profil</button></div>`).join('')||'<p class="mu">Aucun étudiant trouvé.</p>';
    app.querySelectorAll('[data-u]').forEach(c=>c.onclick=e=>{if(e.target.closest('[data-p]'))return;peer=us.find(u=>u.id==c.dataset.u);chatView()})};
  $('#q').oninput=()=>{clearTimeout(tm);tm=setTimeout(draw,300)};draw()}

function chatView(){
  $('#v').innerHTML=`<div class="card"><div class="row"><button class="alt" id="bk">←</button><div class="row u" data-p="${peer.id}">${av(peer)}<b>${E(peer.name)}</b></div></div>
  <div class="chat" id="c"></div><div class="row"><input id="m" placeholder="Votre message…"><button id="s">Envoyer</button></div></div>`;
  $('#bk').onclick=()=>{peer=null;clearInterval(timer);ibView()};
  const load=async()=>{const ms=await api('/msgs/'+peer.id),c=$('#c');if(!c)return;
    const bot=c.scrollTop+c.clientHeight>=c.scrollHeight-20;
    c.innerHTML=ms.map(m=>`<div class="b ${m.frm==me.id?'me':''}">${E(m.text)}<div class="mu" style="color:inherit;opacity:.7">${fmt(m.ts)}</div></div>`).join('');
    if(bot)c.scrollTop=c.scrollHeight};
  const send=async()=>{const t=$('#m').value.trim();if(!t)return;$('#m').value='';await api('/msgs/'+peer.id,{method:'POST',body:{text:t}});load()};
  $('#s').onclick=send;$('#m').onkeydown=e=>{if(e.key=='Enter')send()};
  load().then(()=>{$('#c').scrollTop=1e9});timer=setInterval(load,3000)}

async function userView(id){
  clearInterval(timer);
  if(id==me.id){tab='me';peer=null;return main()}
  const u=await api('/users/'+id);
  $('#v').innerHTML=`<div class="card" style="text-align:center">${cover(u)}<div class="row prof">${av(u,1)}</div>
  <button class="alt" id="bk" style="position:absolute;margin-top:-140px;left:26px">←</button>
  <h3 style="margin:6px 0 0">${E(u.name)}</h3>
  <p class="mu" style="margin:2px">${E(u.faculty)} ${E(u.level)}</p><p>${u.bio?E(u.bio):'<span class="mu">Pas encore de présentation.</span>'}</p>
  <button id="dm">Envoyer un message</button></div>`;
  $('#bk').onclick=()=>main();$('#dm').onclick=()=>{tab='ib';peer=u;main()}}

function profView(){
  $('#v').innerHTML=`<div class="card" style="text-align:center">${cover(me)}<div class="row prof">${av(me,1)}</div>
  <h3 style="margin:6px 0 0">${E(me.name)}</h3><p class="mu" style="margin:2px">${E(me.faculty)} ${E(me.level)}</p><p class="mu">${E(me.email)}</p></div>
  <div class="card"><b>Modifier mon profil</b>
  <form id="f"><input name="name" value="${E(me.name)}" placeholder="Nom">
  <input name="faculty" value="${E(me.faculty)}" placeholder="Faculté / Filière">
  <input name="level" value="${E(me.level)}" placeholder="Niveau">
  <input name="phone" value="${E(me.phone)}" placeholder="Téléphone (privé)">
  <textarea name="bio" rows="3" placeholder="À propos de moi">${E(me.bio)}</textarea>
  <input name="avatar" type="file" accept="image/*"><p class="err" id="e"></p>
  <button>Enregistrer</button> <button type="button" class="alt" id="out">Déconnexion</button></form></div>
  <div class="card"><b>Changer mon mot de passe</b>
  <form id="pf"><input name="old" type="password" placeholder="Ancien mot de passe" required>
  <input name="new" type="password" placeholder="Nouveau mot de passe (6 caractères min.)" required>
  <p id="pe"></p><button>Changer le mot de passe</button></form></div>`;
  $('#f').onsubmit=async e=>{e.preventDefault();try{me=await api('/me',{method:'PUT',body:new FormData(e.target)});profView()}catch(x){$('#e').textContent=x.message}};
  $('#pf').onsubmit=async e=>{e.preventDefault();const p=$('#pe');
    try{await api('/password',{method:'POST',body:Object.fromEntries(new FormData(e.target))});e.target.reset();p.className='okm';p.textContent='Mot de passe modifié.'}
    catch(x){p.className='err';p.textContent=x.message}};
  $('#out').onclick=()=>{localStorage.removeItem('t');tok=me=null;lastN=0;authView()}}

const hide=()=>{const s=$('#splash');if(!s)return;s.classList.add('out');setTimeout(()=>s.remove(),400)};
(async()=>{
  if(tok)try{me=await api('/me');main();setTimeout(hide,700);return}catch{}
  authView();setTimeout(hide,700)})();
</script>
