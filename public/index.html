<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d6ecff">
<title>Meeting University of N'djamena</title>
<style>
/* ===== FIX COMPLET - PLUS DE CARRE JAUNE - DEBUT ===== */
*{
  -webkit-tap-highlight-color: transparent !important;
  -webkit-touch-callout: none !important;
  outline: none !important;
}
*:focus, *:active, *:hover, *:visited, *:focus-visible{
  outline: none !important;
  box-shadow: none !important;
  -webkit-tap-highlight-color: transparent !important;
}
button, a, div, span, nav, nav *, input, select, textarea{
  -webkit-tap-highlight-color: transparent !important;
  outline: none !important;
  -webkit-focus-ring-color: transparent !important;
}
button:focus, a:focus, div:focus, input:focus{
  outline: none !important;
  box-shadow: none !important;
}
nav button, nav a, nav div{
  outline: none !important;
  box-shadow: none !important;
}
/* ===== FIX COMPLET - PLUS DE CARRE JAUNE - FIN ===== */
:root{--bg:#d6ecff;--card:#ffffff;--line:#b9d9f5;--t:#10224a;--mut:#5b6f99;--g:linear-gradient(135deg,#2f6bff,#8a4dff)}
[data-theme="dark"]{--bg:#0f1420;--card:#1a2233;--line:#2a3550;--t:#eef2ff;--mut:#9aa8c7}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t);font:16px/1.4 system-ui,sans-serif;padding-bottom:72px}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:5px 0;color:var(--t)}
.btn{background:var(--g);border:0;border-radius:14px;padding:12px 18px;font-weight:700;cursor:pointer;color:#fff}
.ghost{background:none;border:1px solid var(--line);border-radius:12px;padding:6px 12px;cursor:pointer}
.w{max-width:560px;margin:auto;padding:12px}
.card{background:var(--card);border-radius:20px;padding:14px;margin:12px 0;box-shadow:0 2px 12px #4f8fd622}
.mut{color:var(--mut);font-size:14px}.row{display:flex;gap:10px;align-items:center}.sp{flex:1}
h1,h2{font-weight:800}
.av{width:44px;height:44px;border-radius:50%;background:var(--g);display:grid;place-items:center;font-weight:800;flex:none;color:#fff;overflow:hidden;position:relative}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;padding:10px 0;position:relative;color:var(--mut);display:flex;justify-content:center}
nav button.on{color:#a78bff}
.dot{position:absolute;top:6px;right:22%;background:#ff4d6d;font-size:12px;border-radius:10px;padding:0 6px;color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0}.chips button{white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 14px;cursor:pointer}.chips .on{background:var(--g);border:0;color:#fff}
.st{display:flex;gap:12px;overflow-x:auto;padding:6px 0}.st div{text-align:center;font-size:12px;flex:none;width:68px;cursor:pointer}.st .av{width:62px;height:62px;border:3px solid #8a4dff;font-size:22px}
.ic{background:none;border:0;cursor:pointer;padding:6px 8px;color:var(--mut);display:inline-flex;align-items:center}.ic.on{color:#ff5c8a}
.vk{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#3b8bff;color:#fff;font-size:10px;vertical-align:middle}
.post img,.post video,.big{width:100%;border-radius:16px;margin:8px 0;display:block}
.b{max-width:85%;padding:9px 13px;border-radius:18px;margin:5px 0;background:var(--card)}.me{margin-left:auto;background:var(--g);color:#fff}
.b img,.b video{width:100%;border-radius:12px;margin:6px 0}
.tag{background:var(--line);border-radius:10px;padding:2px 8px;font-size:12px}
.bar{background:var(--line);border-radius:10px;overflow:hidden;margin:5px 0;cursor:pointer;position:relative;padding:8px}.bar i{position:absolute;inset:0 auto 0 0;background:#3b4bd8;opacity:.6}.bar span{position:relative}
#ov{position:fixed;inset:0;background:#000;display:none;place-items:center;z-index:20;color:#fff}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--g);padding:10px 18px;border-radius:20px;display:none;z-index:30;color:#fff;max-width:90%;text-align:center}
.skel{background:var(--line);border-radius:14px;animation:pulse 1.2s infinite}
@keyframes pulse{0%{opacity:.6}50%{opacity:1}100%{opacity:.6}}
.heart-pop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);font-size:90px;pointer-events:none;z-index:2;transition:transform .25s}
.heart-pop.show{transform:translate(-50%,-50%) scale(1.2)}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;margin-top:12px}
.grid div{aspect-ratio:1;background:var(--line);border-radius:8px;overflow:hidden;cursor:pointer}
.grid img{width:100%;height:100%;object-fit:cover;margin:0;border-radius:0}
.progress{height:4px;background:#ffffff44;border-radius:10px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:#fff;width:0%}
.topbar{display:flex;align-items:center;justify-content:space-between}
.bookcover{width:56px;height:74px;border-radius:8px;background:var(--g);display:grid;place-items:center;font-size:28px;color:#fff;flex:none}
.bell{position:relative;background:var(--card);border:1px solid var(--line);border-radius:50%;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;font-size:20px}
.bell i{position:absolute;top:-4px;right:-4px;background:#ff4d6d;color:#fff;font-size:11px;border-radius:10px;padding:1px 6px;font-style:normal}
.cmt{display:flex;gap:8px;align-items:flex-start;margin:8px 0}
.cmt .av{width:32px;height:32px;font-size:14px}
.cmtbox{background:var(--bg);border-radius:14px;padding:8px 10px;flex:1}
.exgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px}
.exgrid div{aspect-ratio:1;background:var(--line);border-radius:8px;overflow:hidden;position:relative;cursor:pointer}
.exgrid img{width:100%;height:100%;object-fit:cover}
.exgrid span{position:absolute;bottom:4px;left:6px;background:#000a;color:#fff;font-size:12px;border-radius:8px;padding:1px 6px}
.price{background:#00c853;color:#fff;font-weight:800;border-radius:10px;padding:4px 10px}
</style>
</head>
<body>
<div id="toast"></div><div id="ov"></div>
<div id="callOv" style="position:fixed;inset:0;background:#000;display:none;z-index:100;color:#fff;flex-direction:column">
  <video id="remoteV" autoplay playsinline style="flex:1;width:100%;background:#000;object-fit:cover"></video>
  <video id="localV" autoplay muted playsinline style="position:absolute;top:12px;right:12px;width:110px;height:150px;background:#222;border-radius:14px;object-fit:cover"></video>
  <div style="position:absolute;top:12px;left:12px"><b id="callName">Appel...</b><div id="callStatus" class="mut" style="color:#fff">Connexion...</div></div>
  <div style="position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:14px">
    <button onclick="toggleMic()" id="micBtn" style="width:56px;height:56px;border-radius:50%;border:0;background:#fff;font-size:22px">🎙️</button>
    <button onclick="toggleCam()" id="camBtn" style="width:56px;height:56px;border-radius:50%;border:0;background:#fff;font-size:22px">📷</button>
    <button onclick="endCall()" style="width:64px;height:64px;border-radius:50%;border:0;background:#ff3b30;font-size:26px">📞</button>
  </div>
</div>
<div id="incomingOv" style="position:fixed;inset:0;background:#000c;display:none;place-items:center;z-index:101;color:#fff">
  <div style="background:#1a2233;padding:22px;border-radius:20px;text-align:center;max-width:320px;width:90%">
    <div id="incomingAvatar" style="margin:auto"></div>
    <h2 id="incomingName" style="margin:12px 0 4px">Quelqu'un t'appelle</h2>
    <p id="incomingType" class="mut" style="color:#c7d2ee">Appel vocal</p>
    <div style="display:flex;gap:12px;justify-content:center;margin-top:18px">
      <button onclick="declineCall()" style="width:60px;height:60px;border-radius:50%;border:0;background:#ff3b30;font-size:26px">✖️</button>
      <button onclick="acceptCall()" style="width:60px;height:60px;border-radius:50%;border:0;background:#00c853;font-size:26px">📞</button>
    </div>
  </div>
</div>
<div id="app"><div class="w"><h1 style="margin-top:40px">Meeting University of N'djamena</h1><p class="mut">Chargement...</p><div class="card"><div class="skel" style="height:120px"></div></div></div></div>
<script>
if(localStorage.theme==='dark') document.documentElement.setAttribute('data-theme','dark');
window.onerror=function(m){try{var t=document.getElementById('toast');t.textContent='Erreur : '+m;t.style.display='block';setTimeout(function(){t.style.display='none'},3000)}catch(e){}};
var reg=false;
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tok=localStorage.t||'',me=null,view='home',F={type:'',group:'',saved:0},cur=null,un=0,eco=localStorage.eco!=='0',ptimer=null,pun=-1,rec=null,chunks=[],feedLimit=10,feedCache=[],storiesCache=[],libCat='Tout',libQ='',libTab='livres',notifCount=0,exploreType='',expandedCm={},leaderboardCache=[],dailyVote=localStorage.dailyVote||'';
const api=async(n,b={})=>{try{const r=await fetch('/api/'+n,{method:'POST',headers:{'Content-Type':'application/json','x-token':tok},body:JSON.stringify(b)});if(r.status===401){localStorage.t=tok='';me=null;return{}}return await r.json()}catch(e){toast('Serveur en réveil, réessaie dans 30 sec');return{e:'Serveur en réveil'}}};
const toast=m=>{const t=$('#toast');if(!t)return;t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)};
const ago=t=>{const m=(Date.now()-t)/6e4|0;return m<1?"à l'instant":m<60?m+' min':m<1440?(m/60|0)+' h':(m/1440|0)+' j'};
const av=(n,id,st='',photo='')=>{let inner='';if(n&&n.includes('Anonyme')){inner='👻'}else if(photo){inner=`<img src="${photo}" onerror="this.remove()">`}else if(id){inner=`${E((n||'?')[0]).toUpperCase()}<img src="/photo/${id}?v=${localStorage.pv||0}" onerror="this.remove()">`}else{inner=E((n||'?')[0]).toUpperCase()}return `<div class="av" style="${st}">${inner}</div>`};
const vb=v=>v?' <span class="vk">✓</span>':'';
const CLASSES=['Général','Droit L1','Droit L2','Droit L3','Médecine L1','Médecine L2','Médecine L3','Biologie L1','Biologie L2','Biologie L3','Math-Physique L1','Math-Physique L2','Math-Physique L3','Mathématiques L1','Mathématiques L2','Mathématiques L3','Sciences Techniques L1','Sciences Techniques L2','Sciences Techniques L3','Physique-Chimie L1','Physique-Chimie L2','Physique-Chimie L3','Informatique L1','Informatique L2','Informatique L3','Économie L1','Économie L2','Économie L3','Lettres L1','Lettres L2','Lettres L3','Sciences L1','Sciences L2','Anglais L1','Anglais L2'];
const IC={home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',new:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',msg:'<path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/>',me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',heart:'<path d="M12 20.5S3 15 3 9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6-9 11.5-9 11.5z"/>',bm:'<path d="M6 3h12v18l-6-4-6 4z"/>',flag:'<path d="M5 21V4h12l-2 4 2 4H5"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',send:'<path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',back:'<path d="M15 5l-7 7 7 7"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>',image:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',lib:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>'};
const IE={home:'🏡',search:'🔎',new:'✨',lib:'📚',msg:'💬',me:'😎',heart:'🤍',bm:'📌',flag:'🚩',mic:'🎙️',send:'🚀',back:'⬅️',stop:'⏹️',image:'🖼️',file:'📄',x:'✖️'};
function I(name,size,on){if(IC[name]) return `<svg width="${size||22}" height="${size||22}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="fill:${on?'currentColor':'none'}">${IC[name]}</svg>`;return `<span style="font-size:${size||22}px">${IE[name]||'•'}</span>`}
const BOOKS=[
{t:'Anatomie humaine - OpenStax',a:'OpenStax',d:'Médecine',e:'🩺',u:'https://openstax.org/details/books/anatomy-and-physiology-2e',desc:'Anatomie et physiologie complète, gratuit.'},
{t:'Biologie - OpenStax',a:'OpenStax',d:'Biologie',e:'🧬',u:'https://openstax.org/details/books/biology-2e',desc:'Biologie générale, cellules, génétique, botanique, zoologie.'},
{t:'Biologie cellulaire et moléculaire',a:'OpenStax',d:'Biologie',e:'🔬',u:'https://openstax.org/details/books/biology-2e',desc:'Cellules, ADN, génétique, évolution.'},
{t:'Microbiologie',a:'OpenStax',d:'Biologie',e:'🦠',u:'https://openstax.org/details/books/microbiology',desc:'Bactéries, virus, immunologie.'},
{t:'Chimie - OpenStax',a:'OpenStax',d:'Physique-Chimie',e:'🧪',u:'https://openstax.org/details/books/chemistry-2e',desc:'Chimie générale, organique, réactions.'},
{t:'Chimie organique',a:'OpenStax',d:'Physique-Chimie',e:'⚗️',u:'https://openstax.org/details/books/organic-chemistry',desc:'Chimie organique universitaire.'},
{t:'Physique universitaire',a:'OpenStax',d:'Physique-Chimie',e:'⚛️',u:'https://openstax.org/details/books/university-physics-volume-1',desc:'Mécanique, ondes, thermodynamique, électricité.'},
{t:'Physique - Électricité et Magnétisme',a:'OpenStax',d:'Math-Physique',e:'⚡',u:'https://openstax.org/details/books/university-physics-volume-2',desc:'Électricité, magnétisme, optique.'},
{t:'Calcul / Mathématiques',a:'OpenStax',d:'Mathématiques',e:'📐',u:'https://openstax.org/details/books/calculus-volume-1',desc:'Analyse, dérivées, intégrales.'},
{t:'Algèbre linéaire et Statistiques',a:'OpenStax',d:'Mathématiques',e:'🔢',u:'https://openstax.org/details/books/introductory-statistics',desc:'Statistiques, probabilités, algèbre.'},
{t:'Mathématiques pour ingénieurs',a:'OpenStax',d:'Math-Physique',e:'➗',u:'https://openstax.org/details/books/calculus-volume-3',desc:'Maths pour Math-Physique et Sciences Techniques.'},
{t:'Introduction à la programmation Python',a:'OpenStax',d:'Informatique',e:'🐍',u:'https://openstax.org/details/books/introduction-python-programming',desc:'Apprendre Python de zéro.'},
{t:'Sciences de l’ingénieur',a:'OpenStax',d:'Sciences Techniques',e:'🔧',u:'https://openstax.org/details/books/university-physics-volume-1',desc:'Mécanique, résistance des matériaux, bases techniques.'},
{t:'Économie - Principes',a:'OpenStax',d:'Économie',e:'💰',u:'https://openstax.org/details/books/principles-economics-3e',desc:'Micro et macro-économie.'},
{t:'Droit constitutionnel',a:'Gallica',d:'Droit',e:'⚖️',u:'https://gallica.bnf.fr/',desc:'Chercher : droit constitutionnel sur Gallica.'},
{t:'Les Misérables',a:'Victor Hugo',d:'Lettres',e:'📖',u:'https://www.gutenberg.org/ebooks/135',desc:'Classique français, domaine public.'},
{t:'Grammaire anglaise',a:'British Council',d:'Anglais',e:'🇬🇧',u:'https://learnenglish.britishcouncil.org/grammar',desc:'Grammaire, vocabulaire, exercices.'},
{t:'Psychologie - Introduction',a:'OpenStax',d:'Général',e:'🧠',u:'https://openstax.org/details/books/psychology-2e',desc:'Psychologie générale universitaire.'}
];
const DAILY_POLLS=[{q:'Tu préfères réviser le matin ou le soir ?',opts:['🌅 Matin','🌙 Soir','😴 Jamais']},{q:'Cours le plus difficile cette semaine ?',opts:['📐 Maths','⚖️ Droit','🧬 Bio','💻 Info']},{q:'Tu es plutôt ?',opts:['📚 Bosseur','🎉 Fêtard','😴 Dormeur','🤫 Discret']},{q:'Meilleur endroit pour réviser ?',opts:['🏠 Maison','📚 Bibliothèque','☕ Café','🌳 Dehors']},{q:'Ton plus gros stress ?',opts:['📝 Examens','💰 Argent','💔 Amour','😰 Tout']}];
function dailyPollHTML(){const day=new Date().getDate(); const p=DAILY_POLLS[day%DAILY_POLLS.length]; const key='daily_'+new Date().toDateString(); const voted=localStorage[key]||''; return `<div class="card" style="background:var(--g);color:#fff"><b>📊 Sondage du jour</b><p style="margin:8px 0">${p.q}</p>${p.opts.map(o=>`<button class="ghost" style="color:#fff;border-color:#fff8;width:100%;text-align:left;margin:3px 0" onclick="voteDaily('${E(o)}')">${o} ${voted===o?'✅ Ton vote':''}</button>`).join('')}<p class="mut" style="color:#e0e7ff;font-size:12px">Vote anonyme, change chaque jour</p></div>`}
function voteDaily(o){localStorage['daily_'+new Date().toDateString()]=o; localStorage.dailyVote=o; toast('Vote enregistré !'); render();}
function toggleEco(){eco=!eco; localStorage.eco=eco?'1':'0'; toast(eco?'Mode Éco activé - images légères ✅':'Mode Éco désactivé'); render();}
function libView(){
  const cats=['Tout','Médecine','Biologie','Mathématiques','Math-Physique','Physique-Chimie','Sciences Techniques','Informatique','Droit','Sciences','Économie','Lettres','Anglais','Général'];
  const list=BOOKS.filter(b=>(libCat==='Tout'||b.d===libCat)&&(!libQ||(b.t+b.a+b.d).toLowerCase().includes(libQ.toLowerCase())));
  return `<div class="topbar"><h2>📚 Bibliothèque</h2><div class="row"><button class="bell" onclick="go('notifs')">🔔${notifCount?`<i>${notifCount}</i>`:''}</button><button class="ghost" onclick="toggleTheme()">🌙</button></div></div>
  <div class="chips"><button class="${libTab==='livres'?'on':''}" onclick="libTab='livres';render()">📖 Livres</button><button class="${libTab==='fiches'?'on':''}" onclick="libTab='fiches';render()">📝 Fiches des étudiants</button></div>
  ${libTab==='livres'?`<input placeholder="🔎 Chercher un livre…" value="${E(libQ)}" oninput="libQ=this.value;render()"><div class="chips">${cats.map(c=>`<button class="${libCat===c?'on':''}" onclick="libCat='${c}';render()">${c}</button>`).join('')}</div>${list.map(b=>`<div class="card row" style="align-items:flex-start"><div class="bookcover">${b.e}</div><div class="sp"><b>${E(b.t)}</b><div class="mut">${E(b.a)} · ${E(b.d)}</div><p style="font-size:14px;margin-top:4px">${E(b.desc)}</p><a class="btn" href="${b.u}" target="_blank" rel="noopener" style="text-decoration:none;padding:8px 14px;font-size:14px;display:inline-block;margin-top:8px">📖 Ouvrir le livre</a></div></div>`).join('')||'<p class="mut card">Aucun livre trouvé.</p>'}`:`<div id="fichesWrap"><p class="mut">Chargement des fiches…</p></div>`}`;
}
async function loadFiches(){if(view!=='lib'||libTab!=='fiches')return; const el=document.getElementById('fichesWrap'); if(!el) return; const fiches=await api('fiches'); if(!fiches) return; el.innerHTML=(fiches||[]).map(p=>{const avg=(p.ratings||[]).length? (p.ratings.reduce((a,r)=>a+r.v,0)/p.ratings.length).toFixed(1):'—'; return `<div class="card"><div class="row">${av(p.name,p.by,'',p.photo)}<div><b>${E(p.name)}</b><div class="mut">${ago(p.at)} · ${E(p.group||'')}</div></div><span class="sp"></span><span>⭐ ${avg} (${(p.ratings||[]).length})</span></div><p style="margin:8px 0">${E(p.text)}</p>${p.img?`<a class="btn" href="${p.img}" target="_blank" style="text-decoration:none;padding:8px 12px;font-size:14px">📄 Ouvrir / Télécharger la fiche</a>`:''}<div class="row" style="margin-top:8px">Noter : ${[1,2,3,4,5].map(s=>`<button class="ghost" onclick="api('rate',{id:'${p.id}',v:${s}}).then(()=>{loadFiches();toast('Merci pour ta note ⭐')})">${s}⭐</button>`).join('')}</div></div>`}).join('')||'<p class="mut card">Aucune fiche pour le moment. Publie un Cours / PDF, il apparaîtra ici !</p>'; }
function toggleTheme(){const d=document.documentElement.getAttribute('data-theme')==='dark';if(d){document.documentElement.removeAttribute('data-theme');localStorage.theme='light'}else{document.documentElement.setAttribute('data-theme','dark');localStorage.theme='dark'}render()}
function nav(){return `<nav>${['home','search','new','lib','msg','me'].map(v=>`<button class="${view===v?'on':''}" onclick="go('${v}')">${I(v,22)}${v==='msg'&&un?`<span class="dot">${un}</span>`:''}</button>`).join('')}</nav>`}
function go(v,c){view=v;cur=c||null;if(v==='notifs'){api('notif_read').then(()=>{notifCount=0})}try{history.pushState({view:v,cur:cur},'','#'+v+(c?'/'+c:''))}catch(e){}render()}
window.addEventListener('popstate',e=>{if(e.state){view=e.state.view||'home';cur=e.state.cur||null;render()}});
function skeleton(){return `<div class="card"><div class="skel" style="height:44px;width:44px;border-radius:50%"></div><div class="skel" style="height:16px;margin-top:12px"></div><div class="skel" style="height:140px;margin-top:10px"></div></div>`}
async function loadNotifs(){try{const r=await api('notifs');if(r&&r.un!==undefined) notifCount=r.un; const b=document.getElementById('bellBtn'); if(b) b.innerHTML=`🔔${notifCount?`<i>${notifCount}</i>`:''}`}catch(e){}}
async function render(){try{if(!tok){$('#app').innerHTML=authHTML();return}if(!me){me=await api('me');if(!me||!me.id){tok='';localStorage.t='';me=null;$('#app').innerHTML=authHTML();return}}let h='';if(view==='home'){h=await home()}else if(view==='search'){h=searchV()}else if(view==='new'){h=newV()}else if(view==='lib'){h=libView()}else if(view==='explore'){h=await exploreV()}else if(view==='notifs'){h=await notifsView()}else if(view==='msg'){h=cur?await convo():await chats()}else{h=await prof(cur||me.id)} $('#app').innerHTML=`<div class="w">${h}</div>`+nav();if(view==='msg'&&cur){const m=$('#ml');if(m)m.scrollTop=1e9}clearInterval(ptimer);ptimer=setInterval(tick,10000);loadNotifs();loadFiches();}catch(e){console.error(e);$('#app').innerHTML=authHTML()}}
function authHTML(){return `<div class="w"><div class="topbar"><h1 style="margin-top:30px;font-size:30px">Meeting University<br>of N'djamena</h1><button class="ghost" onclick="toggleTheme()">🌙</button></div><p class="mut">Le réseau des étudiants</p><div class="card"><select id="f" style="margin:5px 0"><option value="">Choisir ma filière (pour créer un compte)</option>${CLASSES.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>${reg?'':''}<input id="n" placeholder="Nom complet">${reg?'<input id="s" placeholder="Réponse secrète">':''}<input id="p" type="password" placeholder="Mot de passe"><button class="btn" style="width:100%;margin-top:8px" onclick="auth()">${reg?'Créer mon compte':'Se connecter'}</button><p class="mut" style="margin-top:12px" onclick="reg=!reg;render()"><u>${reg?'J\'ai déjà un compte':'Créer un compte'}</u></p>${reg?'':'<p class="mut" style="margin-top:8px" onclick="forgot()"><u>Mot de passe oublié</u></p>'}</div></div>`}
async function auth(){toast('Un instant…');const r=await api(reg?'reg':'login',{name:$('#n').value,pass:$('#p').value,filiere:$('#f')?.value,secret:$('#s')?.value});if(r.e)return toast(r.e);localStorage.t=tok=r.t;me=null;view='home';render()}
async function forgot(){const n=$('#n').value||prompt('Ton nom'),s=prompt('Ta réponse secrète'),p=prompt('Nouveau mot de passe');if(!n||!s||!p)return;const r=await fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,secret:s,pass:p})}).then(r=>r.json());toast(r.e||'Mot de passe changé')}
function img(file){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{if(!eco)return ok(r.result);const i=new Image();i.onload=()=>{const k=Math.min(1,eco?600:800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',eco?.5:.6))};i.src=r.result};r.readAsDataURL(file)})}
const pickMedia=()=>new Promise(ok=>{const i=document.createElement('input');i.type='file';i.accept='image/*,video/*,application/pdf';i.onchange=()=>i.files[0]&&ok(i.files[0]);i.click()});
function readFileAsDataURL(f){return new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(f)})}
function bellHTML(){return `<button class="bell" id="bellBtn" onclick="go('notifs')">🔔${notifCount?`<i>${notifCount}</i>`:''}</button>`}
function leaderboardHTML(){if(!leaderboardCache.length) return ''; return `<div class="card"><b>🏆 Top Étudiants - Les plus actifs</b><p class="mut" style="font-size:12px">+10 pts par publication, +2 par like reçu, +3 par commentaire</p>${leaderboardCache.slice(0,5).map((u,i)=>`<div class="row" style="margin:8px 0" onclick="go('me','${u.id}')"><span style="font-size:20px">${i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1)}</span>${av(u.name,u.id,'',u.photo)}<div class="sp"><b>${E(u.name)}</b><div class="mut">${E(u.filiere)}</div></div><b>${u.pts} pts</b></div>`).join('')}</div>`}
function birthdayHTML(allUsers){if(!allUsers) return ''; const today=new Date(); const list=allUsers.filter(u=>{const d=new Date(u.at||0); return d.getDate()===today.getDate() && d.getMonth()===today.getMonth()}); if(!list.length) return ''; return `<div class="card" style="background:linear-gradient(135deg,#ff9a9e,#fecfef)"><b>🎂 Anniversaire aujourd'hui !</b><p>${list.map(u=>E(u.name)).join(', ')} - Souhaitez-leur un joyeux anniversaire ! 🎉</p></div>`}
async function home(){

  try{const cached=JSON.parse(localStorage.feedCache||'null');if(cached&&cached.length)ps=cached}catch(e){}

  const shown=ps.slice(0,feedLimit);
  const T=[['','Tout'],['annonce','Annonces'],['cours','Cours'],['event','Événements'],['question','❓ Entraide'],['meme','😂 Mèmes'],['confession','👻 Confessions'],['poll','Sondages'],['vente','🛒 Marché']];
  const quickClasses=['Biologie L1','Biologie L2','Math-Physique L1','Mathématiques L1','Sciences Techniques L1','Physique-Chimie L1','Droit L1','Médecine L1'];
  return `<div class="topbar"><h2>Accueil</h2><div class="row"><button class="ghost" onclick="go('explore')">🔍 Découvrir</button>${bellHTML()}<button class="ghost" onclick="toggleTheme()">🌙</button></div></div>
  ${dailyPollHTML()}
  ${birthdayHTML(res[3])}
  ${leaderboardHTML()}
  <div class="st"><div onclick="story()"><div class="av" style="border:3px dashed #8a4dff">+</div>Mon statut</div>${st.map((s,i)=>`<div onclick="openStory(${i})">${av(s.name,s.by,'',s.photo)}${E((s.name||'?').split(' ')[0])}</div>`).join('')}</div>
  <div class="chips">${T.map(([v,l])=>`<button class="${F.type===v&&!F.saved?'on':''}" onclick="F.type='${v}';F.saved=0;feedLimit=10;render()">${l}</button>`).join('')}<button class="${F.saved?'on':''}" onclick="F.saved=1;render()">Favoris</button></div>
  <div class="chips"><button class="${F.group?'':'on'}" onclick="F.group='';render()">Toutes les classes</button>${quickClasses.map(c=>`<button class="${F.group===c?'on':''}" onclick="F.group='${c}';render()">${c}</button>`).join('')}<button class="${F.group===me.filiere?'on':''}" onclick="F.group='${E(me.filiere)}';render()">Ma classe : ${E(me.filiere)}</button></div>
  ${shown.map(postH).join('')||'<p class="mut card">Aucune publication ici. Utilise le bouton + pour publier.</p>'}
  ${ps.length>feedLimit?`<button class="btn" style="width:100%" onclick="feedLimit+=10;render()">Voir plus (${ps.length-feedLimit} restants)</button>`:''}`;
}
function refreshFeed(){feedLimit=10;localStorage.removeItem('feedCache');render();toast('Actualisé')}
function downloadBtn(data,filename,label){return `<a class="ghost" href="${data}" download="${filename}" style="text-decoration:none;display:inline-block">${label}</a>`}
function commentsHTML(p){
  const all=p.com||[]; const showAll=!!expandedCm[p.id]; const list=showAll?all:all.slice(-3);
  return `<div id="cmwrap-${p.id}">
  ${all.length>3?`<button class="ghost" style="margin:8px 0" onclick="expandedCm['${p.id}']=!expandedCm['${p.id}'];render()">${showAll?'Masquer les commentaires':'Voir tous les ${all.length} commentaires'}</button>`:''}
  ${list.map(c=>`<div class="cmt">${av(c.name,c.by,'',c.photo||'')} <div class="cmtbox"><b>${E(c.name)}</b> ${p.best===c.id?'<span style="background:#ffd700;border-radius:8px;padding:1px 6px;font-size:12px">⭐ Meilleure réponse</span>':''} <span class="mut">${ago(c.at)}</span><div>${E(c.text)}</div>${(p.by===me.id && p.type==='question' && p.best!==c.id)?`<button class="ghost" style="margin-top:4px" onclick="api('markbest',{id:'${p.id}',cid:'${c.id}'}).then(render)">⭐ Marquer comme meilleure réponse</button>`:''}</div></div>`).join('')||'<p class="mut" style="margin:6px 0">Aucun commentaire. Sois le premier !</p>'}
  <div class="row" style="margin-top:8px"><input id="cmt-${p.id}" placeholder="Ajouter un commentaire…" onkeydown="if(event.key==='Enter')sendComment('${p.id}')"><button class="btn" style="padding:10px 14px" onclick="sendComment('${p.id}')">Envoyer</button></div></div>`;
}
async function sendComment(pid){const el=document.getElementById('cmt-'+pid); if(!el) return; const t=el.value.trim(); if(!t) return; el.value=''; await api('comment',{id:pid,text:t}); expandedCm[pid]=true; localStorage.removeItem('feedCache'); render(); toast('Commentaire publié 💬')}
function postH(p){
  const sv=(me.saved||[]).includes(p.id),lk=(p.likes||[]).includes(me.id),tot=(p.opts||[]).reduce((a,o)=>a+o.v.length,0);
  const L={annonce:'Annonce',cours:'Cours',event:'Événement',question:'❓ Question / Entraide',meme:'😂 Mème',confession:'👻 Confession',poll:'Sondage',vente:'🛒 Marché'}[p.type];
  const mine=p.by===me.id;
  const displayName=p.anon?'Anonyme 👻':p.name; const displayPhoto=p.anon?'':p.photo;
  let media='';
  if(p.img){
    if(p.img.includes('data:video')||p.img.endsWith('.mp4')||p.img.includes('video/')){media=`<video controls playsinline preload="metadata" src="${p.img}" style="background:#000"></video><div class="row"><button class="ghost" onclick="this.closest('.post').querySelector('video').play()">▶️ Lire</button>${downloadBtn(p.img,'meeting-video-'+p.id+'.mp4','⬇️ Enregistrer')}</div>`}
    else if(p.img.includes('application/pdf')||p.img.endsWith('.pdf')){media=`<div class="card" style="background:var(--bg)"><a href="${p.img}" target="_blank" style="color:var(--t);text-decoration:none">📄 Voir le PDF</a></div><div class="row">${downloadBtn(p.img,'meeting-doc-'+p.id+'.pdf','⬇️ Enregistrer le PDF')}</div>`}
    else{media=`<img loading="lazy" decoding="async" src="${p.img}" ondblclick="dblLike('${p.id}')"><div class="row">${downloadBtn(p.img,'meeting-photo-'+p.id+'.jpg','⬇️ Enregistrer')}</div>`}
  }
  let extra='';
  if(p.type==='vente' && (p.price||p.wa)){ extra=`<div class="row" style="margin-top:8px;flex-wrap:wrap">${p.price?`<span class="price">${E(p.price)} FCFA</span>`:''}${p.wa?`<a class="btn" href="https://wa.me/${E(p.wa.replace(/[^0-9]/g,''))}?text=${encodeURIComponent('Bonjour, ton annonce sur Meeting m’intéresse : '+p.text)}" target="_blank" style="text-decoration:none;padding:8px 14px;font-size:14px">💬 WhatsApp</a>`:''}</div>` }
  if(p.type==='event'){ const part=p.participants||[]; const joined=part.includes(me.id); extra=`<div class="card" style="background:var(--bg);margin:8px 0"><b>📅 Événement - ${part.length} participant(s)</b><p class="mut">${p.date?E(p.date):''}</p><button class="btn" style="margin-top:8px" onclick="api('participate',{id:'${p.id}'}).then(render)">${joined?'✅ Je participe (clique pour annuler)':'Je participe ✅'}</button></div>` }
  return `<div class="card post" id="post-${p.id}"><div class="row" ${p.anon?'':'onclick="go(\'me\',\''+p.by+'\')"' }>${av(displayName,p.anon?'':p.by,'',displayPhoto)}<div><b>${E(displayName)}</b>${p.anon?'':vb(p.v)}<div class="mut">${ago(p.at)}${p.group?' · '+E(p.group):''}</div></div><span class="sp"></span>${mine?`<button class="ghost" onclick="delPost('${p.id}')">🗑️ Supprimer</button>`:''}</div>
  ${L?`<p style="margin-top:8px"><span class="tag">${L}</span>${p.date&&p.type!=='event'?` <span class="tag">${E(p.date)}</span>`:''}</p>`:''}
  <p style="margin-top:8px;white-space:pre-wrap">${E(p.text)}</p>${extra}
  <div style="position:relative" ondblclick="dblLike('${p.id}')">${media}<div class="heart-pop" id="hp-${p.id}">❤️</div></div>
  ${(p.opts||[]).map((o,i)=>`<div class="bar" onclick="api('vote',{id:'${p.id}',i:${i}}).then(render)"><i style="width:${tot?o.v.length/tot*100:0}%"></i><span>${E(o.t)} · ${o.v.length}</span></div>`).join('')}
  <div class="row"><button class="ic ${lk?'on':''}" onclick="api('like',{id:'${p.id}'}).then(render)">${I('heart',22,lk)}</button><span class="mut">${(p.likes||[]).length}</span><button class="ic" onclick="document.getElementById('cmt-${p.id}').focus()">${I('msg',22)}</button><span class="mut">${(p.com||[]).length}</span><span class="sp"></span><button class="ic ${sv?'on':''}" onclick="api('save',{id:'${p.id}'}).then(()=>{me=null;render()})">${I('bm',22,sv)}</button><button class="ic" onclick="rep('${p.by}','${p.id}')">${I('flag',20)}</button></div>
  ${commentsHTML(p)}</div>`;
}
async function delPost(id){if(!confirm('Supprimer cette publication ? Cette action est définitive.'))return;const r=await api('delpost',{id});if(r.e)return toast(r.e);localStorage.removeItem('feedCache');toast('Publication supprimée 🗑️');render()}

async function notifsView(){const r=await api('notifs'); notifCount=0; const list=r.list||[]; return `<div class="topbar"><h2>🔔 Notifications</h2><button class="ghost" onclick="go('home')">Retour</button></div>${list.length?list.map(n=>{let icon=n.type==='like'?'❤️':n.type==='comment'?'💬':'👤'; let txt=n.type==='like'?`a aimé ta publication`:n.type==='comment'?`a commenté : "${E(n.text)}"`:n.text||'s’est abonné(e) à toi'; return `<div class="card row" style="${n.seen?'':'border:2px solid #8a4dff'}" onclick="go('me','${n.from}')">${av(n.fromName,n.from,'',n.fromPhoto)}<div class="sp"><b>${E(n.fromName)}</b> ${txt}<div class="mut">${ago(n.at)}</div></div><span style="font-size:22px">${icon}</span></div>`}).join(''):'<p class="mut card">Aucune notification pour le moment.</p>'}`;}

<textarea id="tx" rows="4" placeholder="Écris ici… (optionnel si photo/vidéo)"></textarea>
<input id="dt" placeholder="Date de l'événement (optionnel)">
<div id="venteFields" style="display:none"><input id="price" placeholder="Prix en FCFA (ex : 15000)"><input id="wa" placeholder="Ton WhatsApp (ex : 23566000000)"></div>
<textarea id="op" rows="3" placeholder="Sondage : une option par ligne (optionnel)"></textarea>
<label class="row"><input type="checkbox" id="anon" style="width:auto"> 👻 Publier en anonyme (pour mème / confession)</label>
<label class="row">Groupe / Classe : <select id="gpSel" style="margin:0">${CLASSES.map(c=>`<option value="${c}" ${c===me.filiere?'selected':''}>${c}</option>`).join('')}</select></label>
<label class="row"><input type="checkbox" id="gp" style="width:auto"> Réserver à cette classe seulement</label>
<div id="pv" style="text-align:center;color:var(--mut);padding:10px;border:1px dashed var(--line);border-radius:14px">Aucun média — appuie sur le bouton ci-dessous</div><div class="row" style="margin-top:10px"><button class="ghost" onclick="pickMediaFile()">📸 Photo / 🎬 Vidéo / 📄 PDF</button><span class="sp"></span><button class="btn" onclick="pub()">Publier ➡️</button></div></div>`}
function togglePubFields(){const ty=document.getElementById('ty').value; document.getElementById('venteFields').style.display=(ty==='vente')?'block':'none'; if(ty==='confession'||ty==='meme') document.getElementById('anon').checked=true;}
async function pickMediaFile(){const f=await pickMedia();if(!f)return;if(f.type.includes('pdf')){draft.img=await readFileAsDataURL(f);$('#pv').innerHTML=`<p>📄 PDF prêt : ${E(f.name)}</p><p class="mut">Appuie sur Publier ➡️</p>`}else if(f.type.startsWith('video/')){draft.img=await readFileAsDataURL(f);$('#pv').innerHTML=`<video controls playsinline src="${draft.img}" style="background:#000"></video><p>🎬 Vidéo prête — appuie sur Publier ➡️</p>`}else{draft.img=await img(f);$('#pv').innerHTML=`<img class="big" src="${draft.img}"><p>🖼️ Photo prête — appuie sur Publier ➡️</p>`}}
async function pub(){if(!$('#tx').value.trim()&&!draft.img)return toast('Écris quelque chose ou choisis une photo / vidéo');const r=await api('post',{type:$('#ty').value,text:$('#tx').value,date:$('#dt').value,img:draft.img,group:$('#gp').checked?$('#gpSel').value:'',price:$('#price')?.value||'',wa:$('#wa')?.value||'',anon:$('#anon').checked,opts:$('#op').value.split('\n').filter(x=>x.trim())});if(r.e)return toast(r.e);draft={};localStorage.removeItem('feedCache');toast('Publié ✅ +10 pts 🏆');go('home')}
async function chats(){const c=await api('chats');const u=await api('users',{q:''});return `<h2>Messages</h2>${(c||[]).map(x=>`<div class="card row" onclick="go('msg','${x.id}')">${av(x.name,x.id,'',x.photo)}<div class="sp"><b>${E(x.name)}</b><div class="mut">${E(String(x.last).slice(0,40))}</div></div>${x.un?`<span class="dot" style="position:static">${x.un}</span>`:''}</div>`).join('')}<p class="mut" style="margin-top:16px">Écrire à un étudiant</p><div class="chips">${(u||[]).slice(0,15).map(x=>`<button onclick="go('msg','${x.id}')">${E(x.name)}</button>`).join('')}</div>`}
function msgMediaHTML(m){
  if(!m.img) return E(m.text||'');
  if(m.img.includes('data:video')) return `<video controls playsinline preload="metadata" src="${m.img}" style="background:#000"></video>${m.text?`<p>${E(m.text)}</p>`:''}<a class="ghost" href="${m.img}" download="msg-video-${m.id}.mp4" style="text-decoration:none;display:inline-block">⬇️ Enregistrer vidéo</a>`;
  if(m.img.includes('application/pdf')) return `<a href="${m.img}" target="_blank" style="color:inherit">📄 Ouvrir le PDF</a><br><a class="ghost" href="${m.img}" download="msg-doc-${m.id}.pdf" style="text-decoration:none;display:inline-block">⬇️ Enregistrer PDF</a>${m.text?`<p>${E(m.text)}</p>`:''}`;
  return `<img src="${m.img}">${m.text?`<p>${E(m.text)}</p>`:''}<a class="ghost" href="${m.img}" download="msg-photo-${m.id}.jpg" style="text-decoration:none;display:inline-block">⬇️ Enregistrer photo</a>`;
}
async function convo(){const r=await api('convo',{with:cur});const u=await api('user',{id:cur});return `<div class="row"><button class="ic" onclick="go('msg')">${I('back',24)}</button>${av(u.name||'?',cur,'',u.photo)}<div class="sp"><b>${E(u.name)}${vb(u.v)}</b></div><button class="ic" onclick="startCall('${cur}','audio')" style="font-size:22px">📞</button><button class="ic" onclick="startCall('${cur}','video')" style="font-size:22px">🎥</button></div><div id="ml" style="padding:10px 0;min-height:60vh">${(r.m||[]).map(m=>`<div class="b ${m.from===me.id?'me':''}">${m.ref?`<div style="border-left:3px solid #fff8;padding-left:8px;font-size:13px;opacity:.85">Réf : ${E(m.ref)}</div>`:''}${m.audio?`<audio controls src="${m.audio}" style="max-width:100%"></audio>`:msgMediaHTML(m)}${m.from===me.id?`<div class="mut" style="text-align:right;font-size:11px">${m.seen?'vu ✓✓':'envoyé ✓'}</div>`:''}</div>`).join('')}</div><div class="row" style="position:sticky;bottom:58px;background:var(--bg);padding:6px 0"><input id="mt" placeholder="Message…" onkeydown="event.key==='Enter'&&snd()"><button class="ic" onclick="sendMsgMedia()" title="Envoyer photo / vidéo / PDF">📎</button><button class="ic" id="mic" onclick="mic()">${I('mic',24)}</button><button class="ic" style="color:#a78bff" onclick="snd()">${I('send',24)}</button></div>`}
async function sendMsgMedia(){const f=await pickMedia();if(!f)return;toast('Envoi du média…');let data='';if(f.type.startsWith('image/')){data=await img(f)}else{data=await readFileAsDataURL(f)}await api('send',{to:cur,text:$('#mt')?.value||'',img:data});render();toast('Média envoyé ✅')}
async function snd(a){const t=$('#mt')?.value;if(!t&&!a)return;await api('send',{to:cur,text:a?'':t,audio:a||''});render()}
async function mic(){if(rec&&rec.state==='recording'){rec.stop();return}try{const s=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(s);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{s.getTracks().forEach(t=>t.stop());$('#mic').innerHTML=I('mic',24);const f=new FileReader();f.onload=()=>snd(f.result);f.readAsDataURL(new Blob(chunks,{type:rec.mimeType}))};rec.start();$('#mic').innerHTML=I('stop',24);toast('Enregistrement…')}catch(e){toast('Micro refusé')}}
async function prof(i){
  const u=i===me.id?me:await api('user',{id:i});const ps=await api('feed',{by:i});
  const mine=i===me.id,fl=(me.following||[]).includes(i);
  const myPts=leaderboardCache.find(x=>x.id===i)?.pts||0;
  return `<div class="card" style="text-align:center"><div onclick="${mine?'setPhoto()':''}" style="width:84px;margin:auto">${av(u.name,i,'width:84px;height:84px;font-size:34px',u.photo)}</div><h2 style="margin-top:8px">${E(u.name)}${vb(u.v)}</h2><p class="mut">${E(u.filiere)} · ${u.fol||0} abonné(s) · 🏆 ${myPts} pts</p><p>${E(u.bio||'')}</p>
  <div class="row" style="justify-content:center;margin-top:10px;flex-wrap:wrap">${mine?`<button class="ghost" onclick="setPhoto()">📸 Changer ma photo</button><button class="ghost" onclick="edit()">Modifier</button><button class="ghost" onclick="toggleTheme()">🌙 Mode sombre</button><button class="ghost" onclick="toggleEco()">${eco?'📶 Mode Éco : ON':'📶 Mode Éco : OFF'}</button><button class="ghost" onclick="api('logout').then(()=>{localStorage.t='';tok='';me=null;render()})">Déconnexion</button>`:`<button class="btn" onclick="api('follow',{id:'${i}'}).then(()=>{me=null;render()})">${fl?'Abonné ✓':"S'abonner"}</button><button class="ghost" onclick="go('msg','${i}')">Message</button>`}</div>
  <div style="margin-top:12px"><select onchange="changeMyFiliere(this.value)" style="max-width:320px;margin:auto"><option value="">Changer ma filière...</option>${CLASSES.map(c=>`<option value="${c}" ${c===u.filiere?'selected':''}>${c}</option>`).join('')}</select></div></div>
  <h2 style="margin-top:6px">Publications (${(ps||[]).length})</h2>
  <div class="grid">${(ps||[]).map(p=>p.img&&!p.img.includes('data:video')&&!p.img.includes('application/pdf')?`<div><img loading="lazy" src="${p.img}"></div>`:p.img&&p.img.includes('data:video')?`<div style="display:grid;place-items:center;font-size:30px">🎬</div>`:p.img?`<div style="display:grid;place-items:center;font-size:30px">📄</div>`:`<div style="display:grid;place-items:center;padding:8px;font-size:13px">${E((p.text||'').slice(0,60))}</div>`).join('')||'<p class="mut">Aucune publication</p>'}</div>
  ${(ps||[]).map(postH).join('')}`;
}
async function changeMyFiliere(v){if(!v) return; await api('bio',{bio:me.bio||'',filiere:v}); me=null; toast('Filière changée : '+v); render();}
async function setPhoto(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=async()=>{const s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=256;c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,256,256);const x=await api('photo',{img:c.toDataURL('image/jpeg',.8)});if(x.e)return toast(x.e);localStorage.pv=Date.now();me=null;toast('Photo enregistrée ✅');render()};im.src=r.result};r.readAsDataURL(f)};i.click()}
async function edit(){const b=prompt('Ta bio',me.bio||''),f=prompt('Ta filière',me.filiere||'');if(b===null)return;await api('bio',{bio:b,filiere:f});me=null;render()}
async function tick(){if(!tok||document.hidden)return;const p=await api('poll');if(!p||p.un===undefined)return;un=p.un;const nv=document.querySelector('nav');if(nv)nv.outerHTML=nav();loadNotifs();}
setInterval(()=>{if(tok) fetch('/api/poll',{method:'POST',headers:{'Content-Type':'application/json','x-token':tok},body:'{}'}).catch(()=>{})},600000);
let startY=0;document.addEventListener('touchstart',e=>{startY=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{const dy=e.changedTouches[0].clientY-startY;if(dy>120&&window.scrollY===0&&tok&&view==='home'){refreshFeed()}},{passive:true});
// ===== APPELS VOCAL / VIDEO - DEBUT =====
let pc=null, localStream=null, callWith=null, callType='audio', callId=null, callPollTimer=null, micOn=true, camOn=true, incomingCall=null;
async function startCall(to,type){
  callWith=to; callType=type;
  const u=await api('user',{id:to});
  document.getElementById('callName').textContent = (u.name||'...') + (type==='video'?' - Vidéo':' - Vocal');
  document.getElementById('callStatus').textContent='Appel en cours...';
  document.getElementById('callOv').style.display='flex';
  document.getElementById('localV').style.display = type==='video'?'block':'none';
  try{
    localStream = await navigator.mediaDevices.getUserMedia({audio:true, video: type==='video'?{width:640,height:480}:false});
    document.getElementById('localV').srcObject = localStream;
  }catch(e){ toast('Micro / Caméra refusé'); endCall(); return; }
  const r = await api('call_start',{to, type});
  callId = r.callId;
  createPeer(true);
  startCallPoll();
  toast('Appel lancé, attends que ton ami décroche...');
}
function createPeer(isCaller){
  pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  if(localStream) localStream.getTracks().forEach(t=>pc.addTrack(t, localStream));
  pc.ontrack = e=>{ document.getElementById('remoteV').srcObject = e.streams[0]; document.getElementById('callStatus').textContent='En appel...'; };
  pc.onicecandidate = e=>{ if(e.candidate && callId) api('call_signal',{callId, cand:e.candidate}); };
  if(isCaller){ pc.createOffer().then(o=>{ pc.setLocalDescription(o); api('call_signal',{callId, offer:o}); }); }
}
function startCallPoll(){
  clearInterval(callPollTimer);
  callPollTimer = setInterval(async()=>{
    if(!callId) return;
    const d = await api('call_poll',{callId});
    if(d.status==='declined'){ toast('Appel refusé'); endCall(); return; }
    if(d.status==='ended'){ toast('Appel terminé'); endCall(); return; }
    if(d.offer && pc && !pc.remoteDescription){ await pc.setRemoteDescription(new RTCSessionDescription(d.offer)); const ans = await pc.createAnswer(); await pc.setLocalDescription(ans); api('call_signal',{callId, answer:ans}); }
    if(d.answer && pc && !pc.remoteDescription){ await pc.setRemoteDescription(new RTCSessionDescription(d.answer)); }
    if(d.cands) for(let c of d.cands){ try{ await pc.addIceCandidate(new RTCIceCandidate(c)); }catch(e){} }
  },1500);
}
async function acceptCall(){
  document.getElementById('incomingOv').style.display='none';
  callWith = incomingCall.from; callType = incomingCall.type; callId = incomingCall.id;
  document.getElementById('callName').textContent = incomingCall.fromName + (callType==='video'?' - Vidéo':' - Vocal');
  document.getElementById('callOv').style.display='flex';
  document.getElementById('localV').style.display = callType==='video'?'block':'none';
  try{ localStream = await navigator.mediaDevices.getUserMedia({audio:true, video: callType==='video'?true:false}); document.getElementById('localV').srcObject = localStream; }catch(e){ toast('Micro refusé'); endCall(); return; }
  await api('call_signal',{callId, accept:true});
  createPeer(false);
  startCallPoll();
}
async function declineCall(){
  document.getElementById('incomingOv').style.display='none';
  if(incomingCall) await api('call_signal',{callId:incomingCall.id, decline:true});
  incomingCall=null;
}
function toggleMic(){ micOn=!micOn; if(localStream) localStream.getAudioTracks().forEach(t=>t.enabled=micOn); document.getElementById('micBtn').textContent = micOn?'🎙️':'🔇'; }
function toggleCam(){ camOn=!camOn; if(localStream) localStream.getVideoTracks().forEach(t=>t.enabled=camOn); document.getElementById('camBtn').textContent = camOn?'📷':'🚫'; }
async function endCall(){
  clearInterval(callPollTimer);
  if(callId) await api('call_signal',{callId, end:true}).catch(()=>{});
  if(pc) pc.close(); pc=null;
  if(localStream) localStream.getTracks().forEach(t=>t.stop()); localStream=null;
  callId=null; incomingCall=null; callWith=null;
  document.getElementById('callOv').style.display='none';
  document.getElementById('incomingOv').style.display='none';
  document.getElementById('remoteV').srcObject=null;
}
setInterval(async()=>{
  if(!tok || callId || !me) return;
  const d = await api('call_check').catch(()=>null);
  if(d && d.incoming && !incomingCall){
    incomingCall = d.incoming;
    document.getElementById('incomingName').textContent = d.incoming.fromName;
    document.getElementById('incomingType').textContent = d.incoming.type==='video'?'Appel vidéo 🎥':'Appel vocal 📞';
    document.getElementById('incomingAvatar').innerHTML = av(d.incoming.fromName, d.incoming.from,'width:72px;height:72px;font-size:30px', d.incoming.fromPhoto||'');
    document.getElementById('incomingOv').style.display='grid';
    try{ new Audio('https://actions.google.com/sounds/v1/alarms/phone_ringtone.ogg').play(); }catch(e){}
  }
},3000);
// ===== APPELS VOCAL / VIDEO - FIN =====
render();
</script>
</body>
</html>
